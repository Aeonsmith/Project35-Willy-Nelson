<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK 1177 // PROJECT 35 ARTIST MAINFRAME SLIDER</title>
  <style>
    :root {
      --bg-color: #05050c;
      --panel-bg: rgba(10, 15, 30, 0.85);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --text-main: #e0f8ff;
      --font-mono: 'Consolas', 'Courier New', monospace;
      --border-glow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* CRT Scanline Overlay */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      z-index: 99;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 1300px;
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--neon-cyan);
      box-shadow: 0 2px 20px rgba(0, 243, 255, 0.2);
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--neon-magenta);
      letter-spacing: 2px;
    }

    .hud-telemetry {
      font-size: 0.8rem;
      color: var(--neon-yellow);
      text-align: right;
    }

    /* Filter & Search Bar */
    .controls-bar {
      width: 100%;
      max-width: 1300px;
      padding: 15px 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid var(--neon-cyan);
      padding: 10px 15px;
      color: var(--neon-cyan);
      font-family: var(--font-mono);
      outline: none;
      font-size: 0.9rem;
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .search-box::placeholder { color: rgba(0, 243, 255, 0.5); }

    /* Slider Container */
    .slider-viewport {
      width: 100%;
      max-width: 1300px;
      position: relative;
      margin: 20px 0;
      padding: 10px 0;
    }

    .slider-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 20px 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--neon-cyan) rgba(0,0,0,0.5);
    }

    .slider-track::-webkit-scrollbar { height: 6px; }
    .slider-track::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

    /* Artist Card */
    .artist-card {
      flex: 0 0 320px;
      background: var(--panel-bg);
      border: 1px solid var(--neon-cyan);
      border-radius: 4px;
      padding: 20px;
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .artist-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--neon-magenta);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
    }

    .artist-card.rank-1 {
      border: 2px solid var(--neon-yellow);
      box-shadow: 0 0 25px rgba(255, 230, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .rank-badge {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--neon-yellow);
    }

    .swag-score {
      font-size: 0.85rem;
      background: rgba(255, 0, 85, 0.2);
      border: 1px solid var(--neon-magenta);
      color: var(--neon-magenta);
      padding: 2px 8px;
      border-radius: 2px;
    }

    .artist-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }

    .swag-tier {
      font-size: 0.75rem;
      color: var(--neon-green);
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .archetype-box {
      background: rgba(0, 243, 255, 0.05);
      border-left: 3px solid var(--neon-cyan);
      padding: 8px 10px;
      font-size: 0.8rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .specialty-text {
      font-size: 0.75rem;
      color: rgba(224, 248, 255, 0.7);
      margin-bottom: 15px;
    }

    .btn-profile {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 0;
      font-size: 0.8rem;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-profile:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* Slider Nav Arrows */
    .slider-nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }

    .nav-btn {
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    /* Modal / Drawer */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #0b0e1a;
      border: 2px solid var(--neon-magenta);
      width: 90%;
      max-width: 600px;
      padding: 30px;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: var(--neon-magenta);
      font-size: 1.5rem;
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(224, 248, 255, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">CYBERPUNK 1177</div>
      <div class="brand-sub">PROJECT 35 // ARTIST MAINFRAME SLIDER</div>
    </div>
    <div class="hud-telemetry">
      <div>MAINFRAME STATUS: ONLINE</div>
      <div>SWAG INDEX: LEVEL 1177</div>
      <div>ACTIVE ROSTER: 19 ENTITIES</div>
    </div>
  </header>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 SEARCH ARTIST / ARCHETYPE / SWAG TIER..." oninput="filterArtists()">
  </div>

  <div class="slider-viewport">
    <div class="slider-track" id="sliderTrack">
      <!-- Injected via JavaScript -->
    </div>

    <div class="slider-nav">
      <button class="nav-btn" onclick="scrollSlider(-340)">◀ PREVIOUS</button>
      <button class="nav-btn" onclick="scrollSlider(340)">NEXT ▶</button>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-content" id="modalBody">
      <span class="close-btn" onclick="closeModalForce()">&times;</span>
      <h2 id="modalName" style="color:var(--neon-cyan); margin-bottom:10px;"></h2>
      <div id="modalTier" style="color:var(--neon-green); font-size:0.85rem; margin-bottom:15px;"></div>
      <div id="modalLore" style="background:rgba(0,243,255,0.05); border-left:3px solid var(--neon-magenta); padding:10px; margin-bottom:15px; font-size:0.9rem;"></div>
      <div id="modalSpecialty" style="font-size:0.85rem; margin-bottom:20px;"></div>
      <a id="modalLink" href="#" target="_blank" class="btn-profile" style="background:var(--neon-magenta); border-color:var(--neon-magenta); color:#fff;">ACCESS EXTERNAL TERMINAL</a>
    </div>
  </div>

  <footer>
    CYBERPUNK 1177 MAINFRAME // ALL 19 ARTISTS INDEXED // EAZY RANK #1 SWAG OVERRIDE
  </footer>

  <script>
    let artistsData = [];

    // Synthesize Cyberpunk UI Beep using Web Audio API
    function playBeep(freq = 880, type = 'sine', dur = 0.05) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e){}
    }

    async function loadArtists() {
      try {
        const res = await fetch('artist_registry.json');
        const data = await res.json();
        artistsData = data.artists;
        renderSlider(artistsData);
      } catch (err) {
        console.error("Loading error:", err);
      }
    }

    function renderSlider(artists) {
      const track = document.getElementById('sliderTrack');
      track.innerHTML = '';
      
      artists.forEach(a => {
        const card = document.createElement('div');
        card.className = `artist-card ${a.rank === 1 ? 'rank-1' : ''}`;
        card.onclick = () => openModal(a);
        
        card.innerHTML = `
          <div class="card-header">
            <span class="rank-badge">#${a.rank}</span>
            <span class="swag-score">SWAG ${a.swag_score}</span>
          </div>
          <div class="artist-name">${a.name}</div>
          <div class="swag-tier">${a.swag_tier}</div>
          <div class="archetype-box">${a.archetype}</div>
          <div class="specialty-text">⚡ ${a.specialty}</div>
          <a href="${a.profile_url}" target="_blank" class="btn-profile" onclick="event.stopPropagation(); playBeep(1200);">VIEW LYRICS & PROFILE</a>
        `;
        track.appendChild(card);
      });
    }

    function scrollSlider(amt) {
      playBeep(600);
      document.getElementById('sliderTrack').scrollBy({ left: amt, behavior: 'smooth' });
    }

    function filterArtists() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = artistsData.filter(a => 
        a.name.toLowerCase().includes(q) || 
        a.archetype.toLowerCase().includes(q) || 
        a.swag_tier.toLowerCase().includes(q)
      );
      renderSlider(filtered);
    }

    function openModal(a) {
      playBeep(950);
      document.getElementById('modalName').innerText = `#${a.rank} ${a.name}`;
      document.getElementById('modalTier').innerText = `TIER: ${a.swag_tier} | SWAG SCORE: ${a.swag_score}/100`;
      document.getElementById('modalLore').innerText = `MAINFRAME LORE:\n${a.lore}`;
      document.getElementById('modalSpecialty').innerText = `SPECIALTY: ${a.specialty}`;
      document.getElementById('modalLink').href = a.profile_url;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') {
        document.getElementById('modalOverlay').style.display = 'none';
      }
    }

    function closeModalForce() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    loadArtists();
  </script>
</body>
</html>
